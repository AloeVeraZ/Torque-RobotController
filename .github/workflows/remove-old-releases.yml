name: Remove every release but V2 (one time)
# V2 (v2.4.34) is the only release. 23 old releases whose tags were deleted earlier are still stored (hidden
# from the public list but counted), so they are deleted here by id. Then this file is deleted.
on:
  push:
    branches: [testing]
    paths: ['.github/workflows/remove-old-releases.yml']
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every release except v2.4.34
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          keep=$(gh api "repos/$GH_REPO/releases/tags/v2.4.34" --jq .id)
          [[ -n "$keep" ]] || { echo "V2 not found: nothing deleted."; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name) \(.draft)"' > all.txt
          echo "Releases now: $(wc -l < all.txt)"; cat all.txt
          failed=0
          while read -r id tag draft; do
            [[ "$id" == "$keep" ]] && continue
            if gh api -X DELETE "repos/$GH_REPO/releases/$id"; then echo "deleted $id ($tag, draft=$draft)"; else echo "::error::could not delete $id ($tag)"; failed=1; fi
          done < all.txt
          echo "Left:"; gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name) \(.draft)"'
          exit $failed
