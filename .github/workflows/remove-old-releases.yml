name: Remove every release but V2 (one time)
# V2 (v2.4.34) is the only release. 23 old releases whose tags were deleted earlier are still stored: the list
# endpoints skip them, but each is still found by its old tag name. Every possible old tag is looked up, each
# release found (other than V2) is deleted by id, and the job fails if any can still be found. Then this file is deleted.
on:
  push:
    branches: [testing]
    paths: ['.github/workflows/remove-old-releases.yml']
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every release except v2.4.34
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          keep=$(gh api "repos/$GH_REPO/releases/tags/v2.4.34" --jq .id)
          [[ -n "$keep" ]] || { echo "V2 not found: nothing deleted."; exit 1; }
          tags="v2.3.0 testing-v2.3.0"; for n in $(seq 0 40); do tags="$tags v2.4.$n testing-v2.4.$n"; done
          find_old(){ for t in $tags; do id=$(gh api "repos/$GH_REPO/releases/tags/$t" --jq .id 2>/dev/null) || continue; [[ -n "$id" && "$id" != "$keep" ]] && echo "$id $t"; done; gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.id != $keep) | \"\(.id) \(.tag_name)\""; }
          find_old | sort -u > old.txt; echo "Found $(wc -l < old.txt) old releases:"; cat old.txt
          while read -r id tag; do gh api -X DELETE "repos/$GH_REPO/releases/$id" && echo "deleted $id ($tag)" || echo "::error::could not delete $id ($tag)"; done < old.txt
          find_old | sort -u > left.txt
          if [[ -s left.txt ]]; then echo "::error::still there: $(tr '\n' ' ' < left.txt)"; exit 1; fi
          echo "Only V2 is left."
