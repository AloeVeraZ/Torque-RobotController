name: Publish app update (manual)
on:
  workflow_dispatch:
  # Pushing v<version> (from main) or testing-v<version> (from testing) publishes that commit.
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', 'testing-v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
# One publish per tag or branch; a duplicate trigger cancels the earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      branch: ${{ steps.meta.outputs.branch }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests load the git-ignored simulator bundles (ui/vendor, sim-runtime), so build them first.
      - name: Build the offline simulator (public assets only)
        run: |
          node tools/simulation/fetch.cjs --targets linux-x64
          node tools/simulation/build.cjs --public
      - run: node --test tests/*.test.cjs
      - run: bash tests/install-bootstrap.sh
      - run: pwsh -NoProfile -File tests/install-bootstrap.ps1
      - id: meta
        shell: bash
        run: |
          branch=$GITHUB_REF_NAME
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" == testing-v* ]]; then branch=testing; else branch=main; fi
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" || { echo "$GITHUB_REF_NAME is not on $branch"; exit 1; }
          fi
          [[ "$branch" == testing || "$branch" == main ]] || exit 1
          version=$(node -p 'require("./package.json").version')
          channel=$(node -p 'require("./package.json").updateChannel')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$branch" == testing ]]; then
            [[ "$channel" == testing ]] || exit 1
            tag="testing-v$version"
          else
            [[ "$channel" == main ]] || exit 1
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == "$tag" ]] || { echo "tag $GITHUB_REF_NAME does not match package.json ($tag)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Each branch builds package.json's mainReleaseTargets / testingReleaseTargets (all when missing).
          targets=$(node tools/release-targets.cjs targets "$branch")
          echo "Building: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(needs.validate.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
        if: matrix.target == 'windows'
      - name: Build the offline simulator (public assets only)
        shell: bash
        run: |
          case "${{ matrix.target }}" in steamdeck) t=linux-x64;; windows) t=win32-x64;; macos-arm64) t=darwin-arm64;; esac
          node tools/simulation/fetch.cjs --targets "$t"
          node tools/simulation/build.cjs --public
      - run: python3 tools/package.py --target ${{ matrix.target }}
        env:
          PYTHONUTF8: '1'
      - run: bash tests/installer-linux.sh
        if: matrix.target == 'steamdeck'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # Every built platform must have its update download and checksum, and nothing else may be
      # there. Then prepare keeps one download per platform (the Windows installer, the Mac zip and
      # the Steam Deck installer), so the release page has exactly one file for each.
      - name: Publish the built platforms
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          BRANCH: ${{ needs.validate.outputs.branch }}
          TARGETS: ${{ needs.validate.outputs.targets }}
        run: |
          node tools/release-targets.cjs prepare dist "$TARGETS" "$VERSION" "$TAG" > "$RUNNER_TEMP/release.json"
          args=(--title "$(jq -r .title "$RUNNER_TEMP/release.json")")
          notes=$(jq -r .notes "$RUNNER_TEMP/release.json")
          if [[ "$BRANCH" == main && -f "docs/releases/$VERSION.md" ]]; then
            summary=$(cat "docs/releases/$VERSION.md")
            notes="${summary}${notes:+$'\n\n'$notes}"
          fi
          # gh puts --notes before the generated notes; the in-app changelog shows both.
          if [[ -n "$notes" ]]; then args+=(--notes "$notes"); fi
          if [[ "$BRANCH" == testing ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes "${args[@]}"
      # No channel manifest is written: the Releases page holds only the versioned releases, and the
      # in-app updater asks GitHub's API for them instead.
      # One time only, for V2 (v2.4.34): once it is published with its three downloads, every other
      # release is deleted with its tag, so V2 is the only release. Any other version skips this.
      - name: Make V2 the only release
        if: needs.validate.outputs.tag == 'v2.4.34'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          names=$(gh release view "$TAG" --json assets --jq '[.assets[].name]|sort|join(",")')
          want="DeckDriverStation-2.4.34-SteamDeck.run,DeckDriverStation-2.4.34-Windows-Setup.exe,DeckDriverStation-2.4.34-macOS-arm64.zip"
          [[ "$names" == "$want" ]] || { echo "V2 has $names, not $want: nothing deleted."; exit 1; }
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            [[ "$old" == "$TAG" ]] && continue
            echo "Deleting $old"; gh release delete "$old" --cleanup-tag --yes
          done
          gh release list --limit 100
