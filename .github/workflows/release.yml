name: Publish app update
on:
  workflow_dispatch:
  # A push to main or testing publishes that commit when package.json's version has no release on that branch yet:
  # main as v<version>, testing as the pre-release testing-v<version>. Installed copies find it in the app (src/updater.cjs).
  push:
    branches: [main, testing]
permissions:
  contents: read
# One publish per tag or branch; a duplicate trigger cancels the earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      branch: ${{ steps.meta.outputs.branch }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests load the git-ignored simulator bundles (ui/vendor, sim-runtime), so build them first.
      - name: Build the offline simulator (public assets only)
        run: |
          node tools/simulation/fetch.cjs --targets linux-x64
          node tools/simulation/build.cjs --public
      - run: node --test tests/*.test.cjs
      - run: bash tests/install-bootstrap.sh
      - run: pwsh -NoProfile -File tests/install-bootstrap.ps1
      - id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$GITHUB_REF_NAME
          [[ "$branch" == testing || "$branch" == main ]] || { echo "Releases come from main or testing, not $branch."; exit 1; }
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$branch" == testing ]]; then tag="testing-v$version"; else tag="v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The same version is published once per branch: a push that does not raise it builds nothing.
          if gh release view "$tag" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::$tag is already released; raise package.json's version to publish this push."; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Each branch builds package.json's mainReleaseTargets / testingReleaseTargets (all when missing).
          targets=$(node tools/release-targets.cjs targets "$branch")
          echo "Building: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    # The Mac app is built on a Mac so tools/package.py can sign it: a downloaded copy then opens instead of saying it is damaged.
    runs-on: ${{ matrix.target == 'macos-arm64' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      matrix:
        target: ${{ fromJSON(needs.validate.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
        if: matrix.target == 'windows'
      - name: Build the offline simulator (public assets only)
        shell: bash
        run: |
          case "${{ matrix.target }}" in steamdeck) t=linux-x64;; windows) t=win32-x64;; macos-arm64) t=darwin-arm64;; esac
          node tools/simulation/fetch.cjs --targets "$t"
          node tools/simulation/build.cjs --public
      # Built for the branch's update channel, so a testing build keeps checking testing and a main build main.
      - run: python3 tools/package.py --target ${{ matrix.target }} --channel ${{ needs.validate.outputs.branch }}
        env:
          PYTHONUTF8: '1'
      - run: bash tests/installer-linux.sh
        if: matrix.target == 'steamdeck'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
  publish:
    needs: [validate, desktop]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # Every built platform must have its update download and checksum, and nothing else may be
      # there. Then prepare keeps one download per platform (the Windows installer, the Mac zip and
      # the Steam Deck installer), so the release page has exactly one file for each.
      - name: Publish the built platforms
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          BRANCH: ${{ needs.validate.outputs.branch }}
          TARGETS: ${{ needs.validate.outputs.targets }}
        run: |
          node tools/release-targets.cjs prepare dist "$TARGETS" "$VERSION" "$TAG" > "$RUNNER_TEMP/release.json"
          args=(--title "$(jq -r .title "$RUNNER_TEMP/release.json")")
          notes=$(jq -r .notes "$RUNNER_TEMP/release.json")
          if [[ "$BRANCH" == main && -f "docs/releases/$VERSION.md" ]]; then
            summary=$(cat "docs/releases/$VERSION.md")
            notes="${summary}${notes:+$'\n\n'$notes}"
          fi
          # gh puts --notes before the generated notes; the in-app changelog shows both.
          if [[ -n "$notes" ]]; then args+=(--notes "$notes"); fi
          if [[ "$BRANCH" == testing ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes "${args[@]}"
      # The Releases page keeps one release per channel at most: a testing build replaces earlier testing builds, and a
      # main release replaces every release with a lower version (main and testing). Installed copies only ever need
      # the newest one. A release whose tag is already gone is deleted without it.
      - name: Remove the releases this one replaces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          BRANCH: ${{ needs.validate.outputs.branch }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            [[ "$old" == "$TAG" ]] && continue
            [[ "$old" =~ ^(testing-)?v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || continue
            testing=${BASH_REMATCH[1]} v=${BASH_REMATCH[2]}
            newest=$(printf '%s\n%s\n' "$v" "$VERSION" | sort -V | tail -1)
            if [[ "$BRANCH" == testing ]]; then [[ -n "$testing" ]] || continue
            else [[ -n "$testing" && "$newest" == "$VERSION" ]] || [[ -z "$testing" && "$newest" == "$VERSION" && "$v" != "$VERSION" ]] || continue; fi
            echo "Removing $old"
            gh release delete "$old" --cleanup-tag --yes || gh release delete "$old" --yes || echo "::warning::Could not remove $old"
          done
          gh release list --limit 100
