name: Remove the updater manifest releases (one time)
# V2 (v2.4.34) is the only release. Its publish deleted every other versioned release, but stopped at the
# two updater manifest releases (main-channel, testing-channel). This removes them, then this file is deleted.
on:
  push:
    branches: [testing]
    paths: ['.github/workflows/remove-channel-releases.yml']
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete main-channel and testing-channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v2.4.34 >/dev/null
          for tag in main-channel testing-channel; do
            id=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>&1) || { echo "$tag: no release ($id)"; continue; }
            echo "$tag: release $id"
            gh api -X DELETE "repos/$GH_REPO/releases/$id" && echo "$tag: release deleted" || echo "::error::$tag: release delete failed"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" && echo "$tag: tag deleted" || echo "::error::$tag: tag delete failed"
          done
          gh release list --limit 100
